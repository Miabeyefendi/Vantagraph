; Vantagraph v5 - Custom Color System
; theme.js bridges these keys to Spicetify standards (see SPICE_BRIDGE).
;
; Surfaces
; window: backmost app background
; panel: left/main/right panel background
; panel-hover: button hover, right-panel cards, album hover
; menu: right-click menu background
; player: bottom player bar background
; stroke: next-song button stroke / highlight line
; Text
; text: primary text (links + body)
; subtext: secondary body text (descriptions, captions)
; Controls
; accent: wave, next-song, next-song top line
; btn-active: active repeat / shuffle / playlist buttons
; tab-active: active tab background in headers
; play-btn: all play button fills
; play-btn-hover: play button hover
; Bars
; bar-fill: playback progress fill
; bar-bg: playback progress track
; heart: liked-song heart icon


